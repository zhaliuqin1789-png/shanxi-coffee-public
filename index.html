<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山喜咖啡｜杯有欢喜，心有山喜</title>
<meta name="description" content="云南楚雄山喜咖啡。山里面，种着我喜欢的东西。">
<link rel="shortcut icon" href="favicon.svg">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="reader-shell" id="reader">
  <header class="reader-header">
    <button class="wordmark" id="wordmark" aria-label="回到封面">山喜 <span>SHANXI COFFEE</span></button>
    <button class="toc-button" id="tocBtn" aria-expanded="false">目录 <span aria-hidden="true">☰</span></button>
  </header>

  <section class="book-stage is-cover" id="stage" aria-live="polite">
    <div class="book-shadow"></div>
    <div class="book" id="book"></div>
  </section>

  <nav class="reader-controls" aria-label="翻页控制">
    <button id="prevBtn" aria-label="上一页">←</button>
    <div class="progress-wrap">
      <span id="progressLeft">1</span>
      <input type="range" min="0" max="15" value="0" id="slider" aria-label="跳转页码">
      <span id="progressRight">16</span>
    </div>
    <button id="nextBtn" aria-label="下一页">→</button>
  </nav>
  <p class="gesture-hint">横向轻扫翻页 · 也可使用左右方向键</p>

  <div class="toc-overlay" id="tocOverlay" role="dialog" aria-modal="true" aria-label="目录" hidden>
    <button class="toc-backdrop" id="tocBackdrop" aria-label="关闭目录"></button>
    <aside class="toc-panel">
      <div class="toc-panel-head">
        <div><p class="eyebrow">CONTENTS</p><h2>目录</h2></div>
        <button id="tocClose" aria-label="关闭目录">×</button>
      </div>
      <ol id="tocList"></ol>
    </aside>
  </div>
</main>

<script>
(function () {
  var PAGES = [
    {
      chapter: "封面",
      cls: "cover-page",
      html: '<div class="cover-content">' +
        '<p class="eyebrow cover-eyebrow">A STORY OF A SMALL COFFEE HOUSE</p>' +
        '<div class="cover-title" aria-label="山喜"><span>山</span><span>喜</span></div>' +
        '<p class="cover-en">SHANXI COFFEE</p>' +
        '<div class="cover-rule"></div>' +
        '<p class="cover-slogan">杯有欢喜，心有山喜</p>' +
        '<p class="cover-place">云南 · 楚雄</p>' +
        '</div>'
    },
    {
      chapter: "序 · 一间小店",
      cls: "",
      html: '<div class="page-grid opening-grid">' +
        '<div class="page-copy opening-copy">' +
        '<p class="eyebrow">PROLOGUE</p>' +
        '<h1 class="display-title">杯有欢喜<br>心有山喜</h1>' +
        '<p class="lead">城市里有许多可以喝咖啡的地方，山喜更想成为一处让人愿意停下来、愿意再回来的地方。</p>' +
        '<p>一杯咖啡从这里开始，也从人与人的相遇开始。它不急着解释自己，只把光、植物、木头和认真做好的一杯饮品，安静地放在你面前。</p>' +
        '</div>' +
        '<figure class="photo hero-photo"><img src="images/hero-sign.jpg" alt="山喜咖啡的店面与绿植" draggable="false"><figcaption>黄昏时，山喜亮起灯。</figcaption></figure>' +
        '</div>'
    },
    {
      chapter: "目录",
      cls: "",
      html: '<div class="contents-page">' +
        '<p class="eyebrow">CONTENTS</p>' +
        '<h2 class="section-title">目录</h2>' +
        '<ol class="contents-list">' +
        '<li><span>序 · 一间小店</span><i></i><b>02</b></li>' +
        '<li><span>一 · 名字的来处</span><i></i><b>04</b></li>' +
        '<li><span>二 · 写给山喜的信</span><i></i><b>06</b></li>' +
        '<li><span>三 · 专业，不严肃</span><i></i><b>08</b></li>' +
        '<li><span>四 · 杯中的欢喜</span><i></i><b>11</b></li>' +
        '<li><span>附录 · 来坐一会儿</span><i></i><b>15</b></li>' +
        '</ol>' +
        '<p class="small-note">点击上方“目录”按钮，可直接抵达任一章节。</p>' +
        '</div>'
    },
    {
      chapter: "一 · 名字的来处",
      cls: "",
      html: '<div class="page-grid origin-grid">' +
        '<div class="page-copy">' +
        '<p class="eyebrow">THE NAME</p>' +
        '<h2 class="display-title compact-title">山里面<br>种着我喜欢的东西</h2>' +
        '<p class="dropcap">“山喜”这个名字，是主理人的妈妈起的。它没有复杂的典故，只是一句朴素又温柔的话：山里面，种着我喜欢的东西。</p>' +
        '<p>如果把咖啡种进山里，也把喜欢的人、喜欢的音乐和喜欢的生活放进去，山喜便不只是一家店，而是一片可以被抵达的心境。</p>' +
        '<blockquote>名字先有了温度，空间与咖啡才慢慢长成它的样子。</blockquote>' +
        '</div>' +
        '<figure class="photo tall-photo"><img src="images/space-green.jpg" alt="山喜咖啡窗外繁茂的绿植" draggable="false"><figcaption>山林中的“我喜欢的东西”。</figcaption></figure>' +
        '</div>'
    },
    {
      chapter: "一 · 名字的来处",
      cls: "",
      html: '<div class="image-led-page">' +
        '<figure class="photo full-photo"><img src="images/garden-table.jpg" alt="山喜咖啡绿植旁的桌椅" draggable="false"></figure>' +
        '<div class="image-caption-block">' +
        '<p class="eyebrow">A GARDEN INSIDE</p>' +
        '<h2>把自然留在室内</h2>' +
        '<p>叶片把阳光筛得柔软，窗框把一段风景收进来。空间不需要刻意制造“松弛感”，当自然真正参与其中，人会自己慢下来。</p>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "二 · 写给山喜的信",
      cls: "rust-panel",
      html: '<div class="statement-page rust-panel">' +
        '<p class="eyebrow light">LETTERS TO A SMALL SHOP</p>' +
        '<h2 class="statement-title light">发现美<br>是一种温柔的能力</h2>' +
        '<p class="statement-copy light">客人送来的不只是照片，而是一封封写给这间小店的信。有人记录一束光，有人记住一张椅子，也有人写下一个陌生人的认真。</p>' +
        '<span class="brush-mark" aria-hidden="true"></span>' +
        '</div>'
    },
    {
      chapter: "二 · 写给山喜的信",
      cls: "",
      html: '<div class="letters-page">' +
        '<div class="letters-quote"><p>每一封信里</p><p>都藏着一双</p><p>善于发现美</p><p>的眼睛</p></div>' +
        '<div class="letters-copy">' +
        '<p>摄影师说，拍照是发现生活里的美。真正爱着什么的人，眼睛里会有光——不只是窗外投进来的光，也是从心底透出来的、热忱的光。</p>' +
        '<p>所以这些照片被保留下来。它们提醒我们，寻常日子并不平淡；只要愿意俯下身看，微小的事物也会发亮。</p>' +
        '<small>来自店内客人与朋友的记录</small>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "三 · 专业，不严肃",
      cls: "",
      html: '<div class="page-grid people-intro-grid">' +
        '<div class="page-copy">' +
        '<p class="eyebrow">THE PEOPLE</p>' +
        '<h2 class="display-title compact-title">专业<br>不严肃</h2>' +
        '<p>山喜的认真并不板着脸。有人磨豆，有人拉花，有人记住熟客喜欢的味道，也有人把一次平常的上班，过成彼此照顾的日常。</p>' +
        '<p>他们是三个人，也是同一间店的三种性格：专注、明亮、自由。咖啡因此有标准，也有人情。</p>' +
        '</div>' +
        '<figure class="photo portrait-complete"><img src="images/team-brand.jpg" alt="山喜成员站在品牌标志旁" draggable="false"><figcaption>人与店一起，成为山喜的样子。</figcaption></figure>' +
        '</div>'
    },
    {
      chapter: "三 · 专业，不严肃",
      cls: "",
      html: '<div class="collage-page">' +
        '<figure class="photo collage-complete"><img src="images/team-collage.jpg" alt="山喜咖啡三位成员的两张合照" draggable="false"><figcaption>一张合照</figcaption></figure>' +
        '<div class="collage-copy">' +
        '<p class="eyebrow">TOGETHER</p>' +
        '<h2>一张合照</h2>' +
        '<p>两个瞬间被留在同一张底片里。镜头前后，他们仍然是店里最真实的样子：会认真，也会玩笑；会磨合，也会彼此成全。</p>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "三 · 专业，不严肃",
      cls: "",
      html: '<div class="barista-page">' +
        '<figure class="photo barista-photo"><img src="images/team-barista.jpg" alt="山喜咖啡师在咖啡机前工作" draggable="false"></figure>' +
        '<div class="barista-copy">' +
        '<p class="eyebrow">CRAFT</p>' +
        '<h2>手会记住</h2>' +
        '<p>研磨的刻度、萃取的时间、奶泡的温度，都要一次次试。熟练不是把人变成机器，而是让手终于有余裕，去照顾每一杯细微的差别。</p>' +
        '<blockquote>专业，是把重复做出温度。</blockquote>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "四 · 杯中的欢喜",
      cls: "",
      html: '<div class="pour-page">' +
        '<figure class="photo pour-photo"><img src="images/pour-over-ice.jpg" alt="咖啡缓缓浇在透明杯中的冰块上" draggable="false"></figure>' +
        '<div class="pour-copy">' +
        '<p class="eyebrow">A CUP IN MOTION</p>' +
        '<h2>一杯咖啡，也有自己的时间</h2>' +
        '<p>液体落下，冰块把温度和光一起收住。山喜希望端上桌的，不只是一个配方，也是一小段值得观看、闻到和慢慢喝完的过程。</p>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "四 · 杯中的欢喜",
      cls: "",
      html: '<div class="products-page">' +
        '<p class="eyebrow">TWO CLASSICS</p>' +
        '<div class="product-stack">' +
        '<article class="product-row">' +
        '<figure class="photo product-photo"><img src="images/americano.jpg" alt="橙C美式" draggable="false"></figure>' +
        '<div><h2>橙 C 美式</h2><p>鲜橙的明亮酸甜，撞进美式的干净微苦，清爽不腻，一口见底。</p></div>' +
        '</article>' +
        '<article class="product-row reverse">' +
        '<figure class="photo product-photo"><img src="images/shanxi-coffee.jpg" alt="山喜咖啡" draggable="false"></figure>' +
        '<div><h2>山喜咖啡</h2><p>心有欢喜，杯有山喜。以细腻奶泡写下店名，让品牌真正落进一杯可以被喝掉的日常。</p></div>' +
        '</article>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "四 · 杯中的欢喜",
      cls: "",
      html: '<div class="products-page">' +
        '<p class="eyebrow">HOUSE SELECTIONS</p>' +
        '<div class="product-stack">' +
        '<article class="product-row">' +
        '<figure class="photo product-photo"><img src="images/super-snow-pine.jpg" alt="超级雪松" draggable="false"></figure>' +
        '<div><h2>超级雪松</h2><p>木质调与淡淡玫瑰气息相遇，松枝与肉桂把森林的想象带到杯边。与咖啡搭配，成为“一豆两喝”的另一种体验。</p></div>' +
        '</article>' +
        '<article class="product-row reverse">' +
        '<figure class="photo product-photo"><img src="images/orange-flow.jpg" alt="橙可椰香流沙" draggable="false"></figure>' +
        '<div><h2>橙可椰香流沙</h2><p>新鲜橙香、榛果可可与柔和椰香碰撞。颜色明亮，味道却克制，是一杯带着山喜性格的奶咖。</p></div>' +
        '</article>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "五 · 光与植物",
      cls: "",
      html: '<div class="plant-page">' +
        '<div class="trimmed-photo" role="img" aria-label="灯光穿过植物的叶片"></div>' +
        '<div class="plant-copy">' +
        '<p class="eyebrow">LIGHT &amp; LEAVES</p>' +
        '<h2>光在叶片之间写字</h2>' +
        '<p>店里的美常常没有中心。它可能只是一盏灯、几片叶子和墙面上的影子，却足以让人记住某个下午。</p>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "附录 · 来坐一会儿",
      cls: "",
      html: '<div class="visit-page">' +
        '<figure class="photo visit-photo"><img src="images/visit-window.jpg" alt="山喜咖啡窗边的座椅和阳光" draggable="false"></figure>' +
        '<div class="visit-copy">' +
        '<p class="eyebrow">COME AND STAY</p>' +
        '<h2>来坐一会儿</h2>' +
        '<p>靠窗的位置会接住下午的光。你可以工作、聊天，也可以什么都不做。这里不催促一杯咖啡应该怎样被喝完。</p>' +
        '</div>' +
        '</div>'
    },
    {
      chapter: "附录",
      cls: "",
      html: '<div class="appendix-page">' +
        '<p class="eyebrow">APPENDIX</p>' +
        '<h2 class="display-title compact-title">欢迎来到<br>山喜</h2>' +
        '<dl class="visit-details">' +
        '<div><dt>地址</dt><dd>楚雄市鹿城镇枫桥水郡北苑商铺 B6、B7</dd></div>' +
        '<div><dt>营业时间</dt><dd>10:30 — 22:30</dd></div>' +
        '</dl>' +
        '<div class="closing-rule"></div>' +
        '<p class="closing-slogan">杯有欢喜，心有山喜</p>' +
        '<p class="closing-note">愿你在城市里，也有一处可以安静坐下的山林。</p>' +
        '</div>'
    }
  ];

  var TOC = [
    { label: "序 · 一间小店", page: 1 },
    { label: "一 · 名字的来处", page: 3 },
    { label: "二 · 写给山喜的信", page: 5 },
    { label: "三 · 专业，不严肃", page: 7 },
    { label: "四 · 杯中的欢喜", page: 10 },
    { label: "附录 · 来坐一会儿", page: 14 }
  ];

  var total = PAGES.length;
  var current = 0;
  var isWide = window.matchMedia("(min-width: 900px)").matches;
  var isTurning = false;
  var dir = "forward";
  var turnTimer = null;

  var book = document.getElementById("book");
  var stage = document.getElementById("stage");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var slider = document.getElementById("slider");
  var progressLeft = document.getElementById("progressLeft");
  var progressRight = document.getElementById("progressRight");
  var tocOverlay = document.getElementById("tocOverlay");
  var tocBtn = document.getElementById("tocBtn");
  var tocList = document.getElementById("tocList");

  function pad2(n) { return String(n).padStart(2, "0"); }

  function normalize(e) {
    var t = Math.max(0, Math.min(total - 1, e));
    if (!isWide || t === 0) return t;
    return t % 2 === 0 ? t - 1 : t;
  }

  function visiblePages(e) {
    var isCover = e === 0;
    if (isWide && !isCover) return [e, e + 1];
    return [e];
  }

  function nextEnabled() {
    if (isWide) return current === 0 || current + 1 < total - 1;
    return current < total - 1;
  }

  function setTocOpen(open) {
    tocOverlay.hidden = !open;
    tocBtn.setAttribute("aria-expanded", String(open));
  }

  function buildToc() {
    var html = '<li><button data-page="0"><span>封面</span><b>01</b></button></li>';
    TOC.forEach(function (item) {
      html += '<li><button data-page="' + item.page + '"><span>' + item.label + '</span><b>' + pad2(item.page + 1) + '</b></button></li>';
    });
    tocList.innerHTML = html;
  }

  function render() {
    var isCover = current === 0;
    var pages = visiblePages(current);
    var html = "";

    pages.forEach(function (pi, idx) {
      var p = PAGES[pi];
      if (!p) {
        html += '<div class="book-page blank-page"></div>';
        return;
      }
      var slot = idx === 0 ? "left-slot" : "right-slot";
      var label = "第 " + (pi + 1) + " 页：" + p.chapter;
      var cls = p.cls ? " " + p.cls : "";
      var footer = "";
      if (pi !== 0) {
        footer = '<footer class="page-footer"><span>' + p.chapter + '</span><b>' + pad2(pi + 1) + '</b></footer>';
      }
      html += '<article class="book-page' + cls + ' ' + slot + '" aria-label="' + label + '">' +
        '<div class="paper-grain" aria-hidden="true"></div>' +
        '<div class="page-inner">' + p.html + '</div>' +
        footer +
        '</article>';
    });

    if (!isCover) {
      html += '<div class="spine" aria-hidden="true"></div>';
    }
    html += '<button class="edge-hit previous-hit" aria-label="上一页"' + (current > 0 && !isTurning ? "" : " disabled") + '></button>';
    html += '<button class="edge-hit next-hit" aria-label="下一页"' + (nextEnabled() && !isTurning ? "" : " disabled") + '></button>';

    book.innerHTML = html;

    var sc = "book-stage " + (isCover ? "is-cover" : "is-open");
    if (isTurning) sc += " turning-" + dir;
    stage.className = sc;

    prevBtn.disabled = !(current > 0) || isTurning;
    nextBtn.disabled = !nextEnabled() || isTurning;

    progressLeft.textContent = (isWide && current > 0) ? (current + 1) + "–" + Math.min(current + 2, total) : String(current + 1);
    progressRight.textContent = String(total);
    slider.value = current;
  }

  function goTo(target, forcedDir) {
    var i = normalize(target);
    if (i === current || isTurning) return;
    dir = forcedDir || (i > current ? "forward" : "backward");
    isTurning = true;
    current = i;
    setTocOpen(false);
    render();
    if (turnTimer) clearTimeout(turnTimer);
    turnTimer = setTimeout(function () {
      isTurning = false;
      render();
    }, 560);
  }

  function next() { goTo(current + (isWide && current !== 0 ? 2 : 1), "forward"); }
  function prev() { goTo(isWide && current > 1 ? current - 2 : current - 1, "backward"); }

  document.getElementById("wordmark").addEventListener("click", function () { goTo(0, "backward"); });
  tocBtn.addEventListener("click", function () { setTocOpen(true); });
  document.getElementById("tocClose").addEventListener("click", function () { setTocOpen(false); });
  document.getElementById("tocBackdrop").addEventListener("click", function () { setTocOpen(false); });
  tocList.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-page]");
    if (!btn) return;
    goTo(Number(btn.getAttribute("data-page")));
  });

  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  slider.addEventListener("input", function () { goTo(Number(slider.value)); });

  book.addEventListener("click", function (e) {
    var btn = e.target.closest(".edge-hit");
    if (!btn || btn.disabled) return;
    if (btn.classList.contains("next-hit")) next(); else prev();
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "Home") goTo(0, "backward");
    else if (e.key === "End") goTo(total - 1, "forward");
    else if (e.key === "Escape") setTocOpen(false);
  });

  var startPoint = null;
  stage.addEventListener("pointerdown", function (e) {
    startPoint = { x: e.clientX, y: e.clientY };
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointerup", function (e) {
    if (!startPoint) return;
    var dx = e.clientX - startPoint.x;
    var dy = e.clientY - startPoint.y;
    startPoint = null;
    if (Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
    if (dx < 0) next(); else prev();
  });
  stage.addEventListener("pointercancel", function () { startPoint = null; });

  window.matchMedia("(min-width: 900px)").addEventListener("change", function (e) {
    isWide = e.matches;
    current = normalize(current);
    render();
  });

  buildToc();
  render();
})();
</script>
</body>
</html>
